[project]
name = "whendoesbuscomejlt"
version = "0.1.0"
description = "Collect raw JLT (Jönköping) real-time data for bus 121"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "gtfs-realtime-bindings>=1.0",
    "tzdata; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 80
